services:
  - type: web
    name: bookmyforex-rag
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false          # Set manually in Render Dashboard → Environment
      - key: GEMINI_API_KEY
        sync: false          # For embeddings only — set in Render Dashboard
      - key: GENERATION_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDING_MODEL
        value: models/gemini-embedding-2
      - key: COLLECTION_NAME
        value: bookmyforex_kb
      - key: TOP_K
        value: "5"
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma_db
